name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution, first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like AllInsight to do?
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project principles
      options:
        - label: Works offline and sends no data
        - label: Doesn't remove anything without the user's approval
