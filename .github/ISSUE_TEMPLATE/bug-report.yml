name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: AllInsight version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "Windows 11 24H2 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Storage Map
        2. Select Downloads
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics (optional)
      description: Settings → Advanced → Export diagnostics. Please review the file before attaching it.
