# Builds and tests AllInsight on a clean Windows machine.
#
# Every push and pull request runs the type check, the Rust test suite (which
# includes the deletion-guard safety tests), the frontend build and the Tauri
# bundler. A tag of the form v1.2.3 also keeps the installer and executable as
# workflow artefacts, so a release can be rebuilt from the tagged commit rather
# than from whatever was on a developer's disk.
#
# This mirrors BUILD_WINDOWS.bat; if one changes, change the other.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type-check the interface
        run: npm run typecheck

      - name: Rust tests, including the safety suite
        working-directory: src-tauri
        run: cargo test

      - name: Build the application and installer
        run: npx tauri build

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash src-tauri/target/release/allinsight.exe, src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 |
            Format-Table -AutoSize

      - name: Keep release artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: allinsight-${{ github.ref_name }}-windows-x64
          path: |
            src-tauri/target/release/allinsight.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
