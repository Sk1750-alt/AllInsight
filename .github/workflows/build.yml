# Builds and tests AllInsight on clean Windows, Linux and macOS machines.
#
# Every push and pull request runs the type check, the Rust test suite (which
# includes the deletion-guard safety tests), the frontend build and the Tauri
# bundler on each platform. The Linux package parsers are also exercised on
# Arch and Fedora, so "works on every Linux" is something CI checks rather
# than something the README claims.
#
# A tag of the form v1.2.3 also keeps the installers as workflow artefacts, so
# a release can be rebuilt from the tagged commit rather than from whatever
# was on a developer's disk.
#
# On a tag, the `release` job then builds latest.json from those exact files,
# signs it with the update key (repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD), and opens a *draft* GitHub release. A
# person reviews the draft and presses Publish; see docs/RELEASE_PROCESS.md.
#
# This mirrors BUILD_WINDOWS.bat and scripts/build-linux.sh; if one changes,
# change the others.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default. Only the release job, which publishes a draft
# release, asks for more, and only for itself.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type-check the interface
        run: npm run typecheck

      - name: Formatting (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check

      # Warnings are errors, as CONTRIBUTING.md asks of contributors.
      - name: Lint (clippy, warnings denied)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests, including the safety suite
        working-directory: src-tauri
        run: cargo test

      - name: Build the application and installer
        run: npx tauri build

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash src-tauri/target/release/allinsight.exe, src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 |
            Format-Table -AutoSize

      - name: Keep release artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: allinsight-${{ github.ref_name }}-windows-x64
          path: |
            src-tauri/target/release/allinsight.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Built on the oldest supported Ubuntu LTS on purpose: an AppImage links
  # against the glibc it was built with, and one built on a new distribution
  # refuses to start on an older one.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install the Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf rpm file xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type-check the interface
        run: npm run typecheck

      - name: Formatting (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check

      # Warnings are errors, as CONTRIBUTING.md asks of contributors.
      - name: Lint (clippy, warnings denied)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests, including the safety suite
        working-directory: src-tauri
        run: cargo test

      - name: Build the application and packages
        run: npx tauri build

      - name: Checksums
        run: |
          cd src-tauri/target/release/bundle
          sha256sum deb/*.deb rpm/*.rpm appimage/*.AppImage

      - name: Keep release artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: allinsight-${{ github.ref_name }}-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # The same test suite on distributions with a different package manager,
  # C library layout and filesystem conventions than Ubuntu. Containers run as
  # root, and AllInsight deliberately protects /root like any other system
  # directory, so the tests run as an ordinary user created for the job.
  linux-distros:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            image: archlinux:latest
            packages: >-
              pacman -Syu --noconfirm --needed base-devel webkit2gtk-4.1 libayatana-appindicator
              librsvg xdotool openssl rustup nodejs npm sudo
          - distro: fedora
            image: fedora:latest
            packages: >-
              dnf install -y gcc gcc-c++ make webkit2gtk4.1-devel libappindicator-gtk3-devel
              librsvg2-devel libxdo-devel openssl-devel rustup nodejs npm sudo
    container: ${{ matrix.image }}

    steps:
      - name: Install the build dependencies
        run: ${{ matrix.packages }}

      - uses: actions/checkout@v4

      - name: Create an unprivileged user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"

      - name: Rust tests, including the safety suite, as that user
        run: |
          sudo -u tester -H bash -lc '
            set -e
            command -v rustup-init >/dev/null && rustup-init -y --profile minimal --default-toolchain stable || rustup default stable
            export PATH="$HOME/.cargo/bin:$PATH"
            cd "'"$GITHUB_WORKSPACE"'"
            mkdir -p dist
            cd src-tauri
            cargo test
          '

  macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the application
        run: npx tauri build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the draft release
      id-token: write        # build-provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect the built packages
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Build latest.json from the exact files being released
        run: |
          version="${GITHUB_REF_NAME#v}"
          exe=$(find release-files -name "AllInsight_${version}_x64-setup.exe" | head -1)
          appimage=$(find release-files -name "*.AppImage" | head -1)
          test -n "$exe" && test -n "$appimage"
          node scripts/make-update-manifest.mjs --version "$version" \
            --asset "windows-x64=${exe}:nsis" \
            --asset "linux-x64=${appimage}:appimage"

      - name: Sign latest.json with the update key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Signing in CI is optional. Without the secret, latest.json goes into
          # the draft unsigned and the maintainer signs it on their own machine
          # (docs/RELEASE_PROCESS.md), so the private key never leaves it. The
          # updater ignores metadata without a valid signature, so a draft
          # cannot be published in a state users would act on.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: sign latest.json locally before publishing."
            exit 0
          fi
          npx tauri signer sign latest.json
          # The same check the application makes, against the key compiled
          # into this commit. A signature the app would reject never ships.
          node scripts/verify-update-manifest.mjs latest.json latest.json.sig

      - name: Checksums file
        run: |
          find release-files -type f \( -name "*-setup.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec sha256sum {} + | sed 's#  .*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Software bills of materials (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          (cd src-tauri && cargo cyclonedx --format json)
          mkdir -p sbom
          find src-tauri -maxdepth 1 -name '*.cdx.json' -exec sh -c 'cp "$1" "sbom/rust-$(basename "$1")"' _ {} \;
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom/npm-sbom.cdx.json
          ls sbom

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-files/**/*-setup.exe
            release-files/**/*.AppImage
            release-files/**/*.deb
            release-files/**/*.rpm
            latest.json
            sbom/*.cdx.json

      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find release-files -type f \( -name "*-setup.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \))
          signature=$(test -f latest.json.sig && echo latest.json.sig || true)
          gh release create "$GITHUB_REF_NAME" $files latest.json $signature SHA256SUMS.txt sbom/*.cdx.json \
            --draft --title "AllInsight ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
