<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="AllInsight">
  <title>AllInsight application icon</title>
  <!--
    The brand kit's app icon: a rounded Slate tile with a Line edge, and the
    A·i mark (an A with a lowercase i standing inside it) in Paper, with the
    Insight Amber dot. Used at 48 px and above; allinsight-app-icon-small.svg
    takes over at 32 px and below.
  -->
  <rect x="0.5" y="0.5" width="99" height="99" rx="22" fill="#1B1F27" stroke="#2A2F38" stroke-width="1"/>
  <g transform="translate(19 19) scale(0.62)">
    <path d="M12 84 L50 18 L88 84" fill="none" stroke="#F4F2EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50" y1="72" x2="50" y2="84" stroke="#F4F2EE" stroke-width="12" stroke-linecap="round"/>
    <circle cx="50" cy="54" r="7" fill="#F5A524"/>
  </g>
</svg>
