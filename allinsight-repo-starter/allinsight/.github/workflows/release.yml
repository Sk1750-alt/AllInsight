name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # create the draft release
      id-token: write        # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-release/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-release/

      # --- Code signing -------------------------------------------------------
      # After SignPath Foundation accepts the project, submit the files in
      # dist-release/ for signing here (signpath/github-action-submit-signing-request)
      # and replace them with the signed versions BEFORE the steps below.
      # -----------------------------------------------------------------------

      - name: Generate SBOMs
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked
          Push-Location src-tauri
          cargo cyclonedx --format json
          Pop-Location
          Get-ChildItem src-tauri -Recurse -Filter *.cdx.json | ForEach-Object {
            Copy-Item $_.FullName "dist-release/rust-$($_.Name)"
          }
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file dist-release/npm-sbom.cdx.json

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist-release -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii dist-release/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist-release/*"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-release/*
