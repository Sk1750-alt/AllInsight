name: Cleanup removed something it shouldn't have
description: Highest priority. Use this if AllInsight deleted, moved or offered to remove a file it shouldn't have.
labels: ["cleanup-incident", "priority: critical"]
body:
  - type: markdown
    attributes:
      value: |
        We're sorry. This is the most serious kind of bug for us and we'll look at it first.
        **First, check your Recycle Bin.** Review items always go there and can be restored.
        If you think this could be exploited on purpose, report it privately via SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: AllInsight version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Which tier was the item shown in?
      options:
        - Safe
        - Review
        - It was never shown to me
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: trigger
    attributes:
      label: How was the cleanup started?
      options:
        - I pressed Clean safely
        - Auto-Clean
        - I selected items in Review
        - From an AI suggestion button
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What was removed?
      description: The type of file and its folder. You can replace personal names, for example C:\Users\<me>\Documents\<file>.docx
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: Was the folder synced with OneDrive? A link or junction? Recently moved?
