name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: AllInsight version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 10 22H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Storage map
        2. Select Downloads
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics (optional)
      description: Settings → Advanced → Export diagnostics. Please review the file before attaching it.
