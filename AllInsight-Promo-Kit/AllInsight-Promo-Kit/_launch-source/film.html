<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AllInsight Launch Film</title>
<script src="shared.js"></script>
<style>
  body { width: 1920px; height: 1080px; position: relative; }
  .abs { position: absolute; }
  #bg { inset: 0; }
  #grain { inset: -240px; background-image: var(--grain); pointer-events: none; mix-blend-mode: screen; }
  #fade { inset: 0; background: #000; }
  .line { left: 0; right: 0; text-align: center; font-weight: 300; letter-spacing: -0.025em; }
  .line .w.serif { font-size: 1.16em; letter-spacing: -0.01em; }
  .line .w { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }
  #dot { left: 960px; top: 430px; width: 0; height: 0; }
  #dot .core, #dot .halo { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  #dot .core { width: 26px; height: 26px; background: #f5a524; box-shadow: 0 0 24px 4px rgba(245,165,36,.65); }
  #dot .halo { width: 520px; height: 520px; background: radial-gradient(closest-side, rgba(245,165,36,.22), rgba(245,165,36,0)); }
  #l1 { top: 540px; font-size: 76px; }
  #l2 { top: 470px; font-size: 104px; }
  #stage3d { inset: 0; perspective: 2200px; perspective-origin: 50% 20%; }
  #win { left: 280px; top: 205px; width: 1360px; height: 840px; transform-origin: 50% 0%; }
  #win .aw { left: 0; top: 0; }
  #sheen { left: 0; top: 0; width: 1360px; height: 840px; border-radius: 18px; overflow: hidden; pointer-events: none; }
  #sheen div { position: absolute; top: -50%; width: 420px; height: 200%; transform: rotate(18deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.07), rgba(255,255,255,0)); }
  #reflect { left: 280px; top: 1050px; width: 1360px; height: 200px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(79,183,201,.18), rgba(79,183,201,0)); filter: blur(30px); }
  #cap { top: 72px; font-size: 52px; }
  #stat { inset: 0; }
  .beat { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .beat .big { font-family: "Instrument Serif", serif; font-size: 300px; line-height: .9; letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #f4f2ee 45%, #8f939b 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .beat .big small { font-size: 150px; }
  .beat .lbl { font-size: 46px; font-weight: 300; letter-spacing: -0.01em; color: #c9cbd0; }
  #end { inset: 0; }
  #endmark { left: 885px; top: 250px; width: 150px; height: 150px; }
  #word { top: 452px; font-size: 128px; font-weight: 500; letter-spacing: -0.035em; }
  #tag { top: 640px; font-size: 48px; color: #c9cbd0; }
  #foot { top: 930px; font-size: 22px; letter-spacing: .22em; text-transform: uppercase; color: #7d828b; font-weight: 400; }
</style>
</head>
<body>
  <div id="bg" class="abs"></div>

  <div id="dot" class="abs"><div class="halo"></div><div class="core"></div></div>
  <div id="l1" class="abs line"></div>
  <div id="l2" class="abs line"></div>

  <div id="reflect" class="abs"></div>
  <div id="stage3d" class="abs"><div id="win" class="abs"></div></div>
  <div id="cap" class="abs line"></div>

  <div id="stat" class="abs">
    <div class="beat" id="b1"><div class="big">14.7<small> GB</small></div><div class="lbl">found safe to clean. Nothing guessed.</div></div>
    <div class="beat" id="b2"><div class="big">Zero</div><div class="lbl">accounts, trackers or cloud.</div></div>
    <div class="beat" id="b3"><div class="big">100<small>%</small></div><div class="lbl">on your device. Works offline.</div></div>
  </div>

  <div id="end" class="abs">
    <div id="endmark" class="abs"></div>
    <div id="word" class="abs line"></div>
    <div id="tag" class="abs line"></div>
    <div id="foot" class="abs line">Free &amp; open source&nbsp;&nbsp;·&nbsp;&nbsp;Windows and Linux&nbsp;&nbsp;·&nbsp;&nbsp;allinsight.biz</div>
  </div>

  <div id="grain" class="abs"></div>
  <div id="fade" class="abs"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const fb = (px) => (px < 0.05 ? "none" : `blur(${px.toFixed(2)}px)`);
  $("#grain").style.setProperty("--grain", GRAIN);

  /* Split a line into words; words wrapped in *asterisks* are set in the serif. */
  function words(el, text) {
    el.innerHTML = text.split(" ").map((w) => {
      const serif = /^\*.*\*[.,]?$/.test(w) || w.startsWith("*") || w.endsWith("*") || w.endsWith("*.");
      return `<span class="w${serif ? " serif" : ""}">${w.replace(/\*/g, "")} </span>`;
    }).join("");
    // Serif runs between asterisks span several words.
    let on = false;
    el.querySelectorAll(".w").forEach((s, i) => {
      const raw = text.split(" ")[i];
      if (raw.startsWith("*")) on = true;
      s.classList.toggle("serif", on);
      if (raw.replace(/[.,]$/, "").endsWith("*")) on = false;
    });
    return [...el.querySelectorAll(".w")];
  }
  /* Apple-style word reveal: rise, unblur, fade; leave by drifting up into blur. */
  function reveal(ws, t, tin, stagger, tout, dur = 0.9) {
    ws.forEach((w, i) => {
      const a = easeExpo(seg(t, tin + i * stagger, tin + i * stagger + dur));
      const o = easeInOut(seg(t, tout, tout + 0.55));
      w.style.opacity = a * (1 - o);
      w.style.transform = `translateY(${lerp(34, 0, a) - o * 26}px)`;
      w.style.filter = fb(lerp(14, 0, a) + o * 12);
    });
  }

  const L1 = words($("#l1"), "Your device knows everything.");
  const L2 = words($("#l2"), "Now, *so do you.*");
  const CAP = words($("#cap"), "Your whole device. *In one calm view.*");
  const WORD = words($("#word"), "AllInsight");
  const TAG = words($("#tag"), "Your device, *understood.*");
  $("#win").innerHTML = appWindowHTML() + `<div id="sheen" class="abs"><div></div></div>`;
  $("#endmark").innerHTML = markSVG("endmk");
  const WIN = $("#win");

  window.render = function (t) {
    /* Background light: warm for the dot, cool under the window, warm again at the end. */
    const warm = clamp(seg(t, 0.3, 1.6) - seg(t, 3.4, 5)) + seg(t, 16.6, 18) * 0.9;
    const cool = seg(t, 6, 8) - seg(t, 10.6, 11.4);
    $("#bg").style.background = `
      radial-gradient(900px 620px at 50% 42%, rgba(245,165,36,${0.07 * warm}), transparent 70%),
      radial-gradient(1400px 700px at 50% 70%, rgba(79,183,201,${0.10 * cool}), transparent 70%),
      radial-gradient(2000px 1200px at 50% 50%, #0d0e11, #050506 70%)`;

    /* 1 — the dot. */
    const din = easeExpo(seg(t, 0.3, 1.5)), dout = easeInOut(seg(t, 3.2, 3.9));
    const breathe = 1 + 0.06 * Math.sin(t * 2.6);
    $("#dot").style.opacity = din * (1 - dout);
    $("#dot .core").style.transform = `translate(-50%,-50%) scale(${lerp(0.2, 1, din) * (1 - dout * 0.7)})`;
    $("#dot .halo").style.transform = `translate(-50%,-50%) scale(${lerp(0.4, 1, din) * breathe})`;
    $("#dot").style.top = `${430 - dout * 30}px`;
    reveal(L1, t, 1.2, 0.11, 3.2);

    /* 2 — the promise. */
    reveal(L2, t, 3.9, 0.14, 5.45, 1.0);

    /* 3 — the window rises out of the dark and settles flat. */
    const rise = easeExpo(seg(t, 5.7, 8.0));
    const push = easeInOut(seg(t, 7.6, 11.2));
    const leave = easeInOut(seg(t, 10.7, 11.4));
    WIN.style.opacity = clamp(seg(t, 5.7, 6.6)) * (1 - leave);
    WIN.style.transform = `translateY(${lerp(520, 0, rise) - push * 14}px) rotateX(${lerp(38, 0, rise)}deg) scale(${lerp(0.8, 1, rise) * lerp(1, 1.035, push) * lerp(1, 1.06, leave)})`;
    WIN.style.filter = fb(leave * 16);
    $("#reflect").style.opacity = rise * (1 - leave);
    setAppWindow(WIN, seg(t, 6.6, 9.6));
    $("#sheen div").style.left = `${lerp(-700, 1700, easeInOut(seg(t, 7.2, 8.8)))}px`;
    reveal(CAP, t, 8.1, 0.09, 10.6);

    /* 4 — three numbers. */
    const beats = [["#b1", 11.35], ["#b2", 12.85], ["#b3", 14.35]];
    beats.forEach(([id, s]) => {
      const a = easeExpo(seg(t, s, s + 0.7)), o = easeInOut(seg(t, s + 1.15, s + 1.5));
      const el = $(id);
      el.style.opacity = a * (1 - o);
      el.style.transform = `scale(${lerp(1.08, 1, a) * lerp(1, 0.96, o)})`;
      el.style.filter = fb(lerp(20, 0, a) + o * 14);
    });
    const gb = easeOut(seg(t, 11.35, 12.3)) * 14.7;
    $("#b1 .big").innerHTML = `${gb.toFixed(1)}<small> GB</small>`;
    const pc = Math.round(easeOut(seg(t, 14.35, 15.2)) * 100);
    $("#b3 .big").innerHTML = `${pc}<small>%</small>`;

    /* 5 — the mark draws itself, then the name. */
    setMark($("#endmark"), easeInOut(seg(t, 15.9, 17.0)), easeOut(seg(t, 16.75, 17.15)), seg(t, 17.0, 17.45),
      seg(t, 17.2, 17.6) * (0.85 + 0.15 * Math.sin(t * 3)));
    $("#endmark").style.transform = `translateY(${lerp(120, 0, easeInOut(seg(t, 17.3, 18.2)))}px) scale(${lerp(1.25, 1, easeInOut(seg(t, 17.3, 18.2)))})`;
    reveal(WORD, t, 17.55, 0, 99, 1.0);
    reveal(TAG, t, 18.0, 0.12, 99, 1.0);
    $("#foot").style.opacity = easeOut(seg(t, 18.6, 19.3));

    $("#grain").style.transform = `translate(${(Math.floor(t * 24) * 73) % 240}px, ${(Math.floor(t * 24) * 131) % 240}px)`;
    $("#fade").style.opacity = 1 - easeOut(seg(t, 0, 0.5)) + easeInOut(seg(t, 19.6, 20));
  };

  /* Preview in a browser: plays in real time; ?t=12 freezes a frame. */
  const q = new URLSearchParams(location.search);
  if (!q.has("render")) {
    if (q.has("t")) render(+q.get("t"));
    else { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % 20.5); requestAnimationFrame(loop); })(); }
  }
</script>
</body>
</html>
